name: CI

on:
  push:
  pull_request:

jobs:
  # Runs fast, deterministic unit tests (integration excluded via pytest.ini testpaths).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q

  # Exercises FastAPI ingestion (/ingest) using TestClient (no secrets).
  integration-http:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run HTTP ingestion integration test
        run: pytest -q tests/integration/test_http_upload.py

  # Reads and writes Google Sheets when service-account JSON and sheet IDs are provided.
  integration-sheets:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt

      # Decide at runtime whether to run Sheets tests (secrets are available at step scope).
      - name: Gate Sheets integrations
        id: gate
        env:
          SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SRC: ${{ secrets.SHEET_URL_OR_ID }}
          DST: ${{ secrets.UPLOAD_SHEET_URL_OR_ID }}
        run: |
          if [ -z "$SA_JSON" ] || { [ -z "$SRC" ] && [ -z "$DST" ]; }; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "No Sheets secrets/IDs provided — skipping Sheets integrations."
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Materialize Google credentials + test env
        if: steps.gate.outputs.run == 'true'
        env:
          SA_JSON: ${{ secrets.GCP_SA_JSON }}
          SRC: ${{ secrets.SHEET_URL_OR_ID }}
          DST: ${{ secrets.UPLOAD_SHEET_URL_OR_ID }}
          SRC_TAB: ${{ secrets.SHEET_TAB }}
          DST_TAB: ${{ secrets.UPLOAD_SHEET_TAB }}
        run: |
          echo "$SA_JSON" > "$GITHUB_WORKSPACE/credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/credentials.json" >> $GITHUB_ENV
          [ -n "$SRC" ] && echo "SHEET_URL_OR_ID=$SRC" >> $GITHUB_ENV
          [ -n "$SRC_TAB" ] && echo "SHEET_TAB=$SRC_TAB" >> $GITHUB_ENV
          [ -n "$DST" ] && echo "UPLOAD_SHEET_URL_OR_ID=$DST" >> $GITHUB_ENV
          [ -n "$DST_TAB" ] && echo "UPLOAD_SHEET_TAB=$DST_TAB" >> $GITHUB_ENV

      - name: Run Google Sheets integration tests (read + write)
        if: steps.gate.outputs.run == 'true'
        run: pytest -q tests/integration/test_gsheets_read.py tests/integration/test_gsheets_write.py

  # Optional network test for RandomUser; opt-in via repo variable RUN_RANDOMUSER_INTEGRATION='1'.
  integration-randomuser:
    if: ${{ vars.RUN_RANDOMUSER_INTEGRATION == '1' }}
    needs: unit
    runs-on: ubuntu-latest
    env:
      RUN_RANDOMUSER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run RandomUser integration test
        run: pytest -q tests/integration/test_random_user_fetch.py
